server:
  port: 8081

spring:
  flyway:
    enabled: false
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5432/devconnect_auth}
    username: ${AUTH_DB_USERNAME:postgres}
    password: ${AUTH_DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    issuer: ${JWT_ISSUER:devconnect}
    access-token-secret: ${JWT_ACCESS_TOKEN_SECRET:change-me-change-me-change-me-change-me}
    refresh-token-secret: ${JWT_REFRESH_TOKEN_SECRET:change-me-change-me-change-me-change-me}
    access-token-ttl-seconds: 900
    refresh-token-ttl-seconds: 1209600
