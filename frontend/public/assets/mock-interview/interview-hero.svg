<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" fill="none" role="img" aria-label="Mock interview video call with candidate and mentor">
  <defs>
    <linearGradient id="heroBg" x1="40" y1="20" x2="520" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1e1b4b" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#161722"/>
      <stop offset="1" stop-color="#0b0c14"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Decorative stars -->
  <circle cx="480" cy="42" r="3" fill="#818cf8" opacity="0.7"/>
  <circle cx="510" cy="78" r="2" fill="#6366f1" opacity="0.5"/>
  <circle cx="60" cy="55" r="2.5" fill="#a5b4fc" opacity="0.6"/>
  <circle cx="35" cy="120" r="2" fill="#6366f1" opacity="0.4"/>

  <!-- Left laptop (girl) -->
  <g transform="translate(28, 95)">
    <rect x="0" y="0" width="200" height="130" rx="12" fill="url(#screenGrad)" stroke="#4f46e5" stroke-opacity="0.55" stroke-width="1.5"/>
    <!-- Code lines on screen -->
    <rect x="16" y="18" width="70" height="6" rx="3" fill="#6366f1" opacity="0.85"/>
    <rect x="16" y="32" width="110" height="4" rx="2" fill="#3d3e52"/>
    <rect x="16" y="42" width="95" height="4" rx="2" fill="#3d3e52"/>
    <rect x="16" y="52" width="105" height="4" rx="2" fill="#6366f1" opacity="0.45"/>
    <rect x="16" y="62" width="88" height="4" rx="2" fill="#22c55e" opacity="0.55"/>
    <rect x="16" y="72" width="100" height="4" rx="2" fill="#3d3e52"/>
    <!-- Girl character -->
    <circle cx="100" cy="98" r="28" fill="#312e81"/>
    <!-- Purple hair -->
    <path d="M72 88 Q100 68 128 88 Q130 72 100 62 Q70 72 72 88" fill="#6366f1"/>
    <circle cx="100" cy="92" r="22" fill="#fcd9bd"/>
    <!-- Eyes -->
    <circle cx="93" cy="90" r="2" fill="#1e1f2e"/>
    <circle cx="107" cy="90" r="2" fill="#1e1f2e"/>
    <path d="M94 98 Q100 102 106 98" stroke="#c4a484" stroke-width="1.5" fill="none"/>
    <!-- Headphones -->
    <path d="M78 88 Q78 72 100 70 Q122 72 122 88" stroke="#818cf8" stroke-width="3.5" fill="none"/>
    <rect x="72" y="84" width="10" height="16" rx="4" fill="#6366f1"/>
    <rect x="118" y="84" width="10" height="16" rx="4" fill="#6366f1"/>
    <!-- Shoulders -->
    <path d="M72 118 Q100 108 128 118 L128 130 L72 130 Z" fill="#161722"/>
    <!-- Laptop base -->
    <rect x="-10" y="130" width="220" height="10" rx="4" fill="#2d2e3e"/>
    <rect x="60" y="140" width="80" height="5" rx="2.5" fill="#1e1f2e"/>
  </g>

  <!-- Right laptop (boy) -->
  <g transform="translate(332, 95)">
    <rect x="0" y="0" width="200" height="130" rx="12" fill="url(#screenGrad)" stroke="#4f46e5" stroke-opacity="0.55" stroke-width="1.5"/>
    <!-- Code lines -->
    <rect x="16" y="18" width="60" height="6" rx="3" fill="#6366f1" opacity="0.85"/>
    <rect x="16" y="32" width="100" height="4" rx="2" fill="#3d3e52"/>
    <rect x="16" y="42" width="115" height="4" rx="2" fill="#3d3e52"/>
    <rect x="16" y="52" width="90" height="4" rx="2" fill="#6366f1" opacity="0.45"/>
    <rect x="16" y="62" width="105" height="4" rx="2" fill="#22c55e" opacity="0.55"/>
    <!-- Boy character -->
    <circle cx="100" cy="98" r="28" fill="#3730a3"/>
    <circle cx="100" cy="92" r="22" fill="#fcd9bd"/>
    <!-- Hair -->
    <path d="M78 82 Q100 70 122 82 Q124 76 100 68 Q76 76 78 82" fill="#1e1f2e"/>
    <!-- Eyes -->
    <circle cx="93" cy="90" r="2" fill="#1e1f2e"/>
    <circle cx="107" cy="90" r="2" fill="#1e1f2e"/>
    <path d="M94 98 Q100 102 106 98" stroke="#c4a484" stroke-width="1.5" fill="none"/>
    <!-- Waving hand -->
    <path d="M128 88 Q148 72 144 58 Q140 50 132 56 Q128 64 128 72" stroke="#fcd9bd" stroke-width="5" stroke-linecap="round" fill="none"/>
    <!-- Shoulders / shirt -->
    <path d="M72 118 Q100 108 128 118 L128 130 L72 130 Z" fill="#6366f1" opacity="0.7"/>
    <!-- Laptop base -->
    <rect x="-10" y="130" width="220" height="10" rx="4" fill="#2d2e3e"/>
    <rect x="60" y="140" width="80" height="5" rx="2.5" fill="#1e1f2e"/>
  </g>

  <!-- Video call toolbar (floating between laptops) -->
  <g transform="translate(195, 68)" filter="url(#softGlow)">
    <rect x="0" y="0" width="170" height="36" rx="18" fill="#161722" stroke="#6366f1" stroke-opacity="0.45" stroke-width="1.5"/>
    <!-- Camera icon -->
    <circle cx="30" cy="18" r="12" fill="#6366f1" opacity="0.25"/>
    <rect x="24" y="14" width="12" height="8" rx="2" fill="#a5b4fc"/>
    <circle cx="30" cy="16" r="2.5" fill="#6366f1"/>
    <!-- Mic icon -->
    <circle cx="70" cy="18" r="12" fill="#6366f1" opacity="0.25"/>
    <rect x="67" y="12" width="6" height="10" rx="3" fill="#a5b4fc"/>
    <path d="M64 22 Q70 26 76 22" stroke="#a5b4fc" stroke-width="1.5" fill="none"/>
    <!-- End call -->
    <circle cx="130" cy="18" r="14" fill="#ef4444"/>
    <path d="M122 18 L138 18 M130 10 L130 26" stroke="white" stroke-width="2.5" stroke-linecap="round" transform="rotate(135 130 18)"/>
  </g>

  <!-- Connection line between screens -->
  <path d="M228 160 Q280 145 332 160" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4"/>

  <!-- Small floating video tile -->
  <rect x="248" y="200" width="64" height="48" rx="10" fill="#0b0c14" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1.5"/>
  <circle cx="280" cy="218" r="12" fill="#4f46e5"/>
  <rect x="262" y="232" width="36" height="4" rx="2" fill="#6366f1" opacity="0.5"/>

  <rect width="560" height="340" fill="url(#heroBg)" pointer-events="none"/>
</svg>
