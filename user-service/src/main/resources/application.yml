server:
  port: 8082

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  flyway:
    enabled: false
  datasource:
    url: ${USER_DB_URL:jdbc:postgresql://localhost:5432/devconnect_user}
    username: ${USER_DB_USERNAME:postgres}
    password: ${USER_DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174}
  jwt:
    issuer: ${JWT_ISSUER:devconnect}
    access-token-secret: ${JWT_ACCESS_TOKEN_SECRET:change-me-change-me-change-me-change-me}
  notification-service:
    base-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8084}
    internal-api-key: ${NOTIFICATION_INTERNAL_API_KEY:devconnect-internal}
  mentor-service:
    base-url: ${MENTOR_SERVICE_URL:http://localhost:8086}
  payment-service:
    base-url: ${PAYMENT_SERVICE_URL:http://localhost:8089}
    internal-api-key: ${PAYMENT_INTERNAL_API_KEY:devconnect-internal}
  chat-service:
    base-url: ${CHAT_SERVICE_URL:http://localhost:8083}
    internal-api-key: ${CHAT_INTERNAL_API_KEY:devconnect-internal}
  community-upload:
    upload-dir: ${COMMUNITY_UPLOAD_DIR:./uploads/community}
    max-image-bytes: 5242880
    max-attachment-bytes: 20971520
  video-rooms:
    free-max-participants: 6
    free-duration-minutes: 30
    free-room-cooldown-hours: 24
    premium-price-inr: 50
    premium-price-cents: 5000
    join-path-prefix: /video-rooms/join/
    frontend-base-url: ${APP_FRONTEND_URL:http://localhost:5173}
