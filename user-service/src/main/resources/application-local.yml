# Local dev without Docker — run: set SPRING_PROFILES_ACTIVE=local && mvn -pl user-service spring-boot:run
server:
  port: 8082

spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
  datasource:
    url: jdbc:h2:file:./data/devconnect_user;MODE=PostgreSQL;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false
