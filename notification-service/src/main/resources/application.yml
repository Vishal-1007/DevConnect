server:
  port: 8084

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  flyway:
    enabled: false
  datasource:
    url: ${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5432/devconnect_notification}
    username: ${NOTIFICATION_DB_USERNAME:postgres}
    password: ${NOTIFICATION_DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.developersconnect.events.payment
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.developersconnect.events.payment.PaymentEventEnvelope

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174}
  jwt:
    issuer: ${JWT_ISSUER:devconnect}
    access-token-secret: ${JWT_ACCESS_TOKEN_SECRET:change-me-change-me-change-me-change-me}
  kafka:
    enabled: ${KAFKA_ENABLED:true}
  internal:
    api-key: ${NOTIFICATION_INTERNAL_API_KEY:devconnect-internal}
  chat-service:
    base-url: ${CHAT_SERVICE_URL:http://localhost:8083}
