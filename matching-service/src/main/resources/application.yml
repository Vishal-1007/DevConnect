server:
  port: 8085

spring:
  flyway:
    enabled: false
  datasource:
    url: ${MATCHING_DB_URL:jdbc:postgresql://localhost:5432/devconnect_matching}
    username: ${MATCHING_DB_USERNAME:postgres}
    password: ${MATCHING_DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    issuer: ${JWT_ISSUER:devconnect}
    access-token-secret: ${JWT_ACCESS_TOKEN_SECRET:change-me-change-me-change-me-change-me}
  chat-service:
    base-url: ${CHAT_SERVICE_URL:http://localhost:8083}
