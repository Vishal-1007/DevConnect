server:
  port: 8083

spring:
  flyway:
    enabled: false
  datasource:
    url: ${CHAT_DB_URL:jdbc:postgresql://localhost:5432/devconnect_chat}
    username: ${CHAT_DB_USERNAME:postgres}
    password: ${CHAT_DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost:5175}
  jwt:
    issuer: ${JWT_ISSUER:devconnect}
    access-token-secret: ${JWT_ACCESS_TOKEN_SECRET:change-me-change-me-change-me-change-me}
